# Plumber configuration: only the deltas from the built-in default.
# Full reference: https://github.com/getplumber/plumber/blob/main/defaultConfig/.plumber.yaml
extends: plumber:default
version: "2.0"

github:
  controls:
    githubActionMustComeFromAuthorizedSources:
      # Keep Plumber's curated list and add the third-party actions this repo already relies on.
      includePlumberDefaults: true
      trustedGithubActions:
        - crazy-max/ghaction-import-gpg
        - jdx/mise-action
        - mikepenz/action-junit-report
        - runs-on/action
